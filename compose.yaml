services:
  evidence:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - evidence_template:/app/.evidence/template
      - evidence_meta:/app/.evidence/meta
      - evidence_data:/app/static/data

volumes:
  node_modules:
  evidence_template:
  evidence_meta:
  evidence_data:
